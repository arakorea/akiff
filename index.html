<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Ara Korea Film Festival (AKFF)</title>
<meta content="Ara Korea Film Festival (AKFF) — an international film festival recognizing overall excellence across all genres." name="description"/>
<style>
 :root{
 --bg:#ffffff;
 --text:#111111;
 --muted:#6a6a6a;
 --line:#e6e6e6;
 --max:1000px;
 }
 *{ box-sizing:border-box; }
 body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
 Roboto, Helvetica, Arial;
 line-height:1.7;
 letter-spacing:0.15px;
 font-size:15px;
 }
 a{ color:inherit; text-decoration:none; }
 a:hover{ text-decoration:none; }

 .wrap{ max-width:var(--max); margin:0 auto; padding:20px 20px 64px; }

 header{
 position:relative;
 background: #ffffff;
 border-bottom:1px solid var(--line);
 z-index: 10;
 }

 .topbar{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:14px 0;
 font-size:12px;
 text-transform:uppercase;
 letter-spacing:0.7px;
 gap:16px;
 }
 .brand a{ font-weight:700; }
 nav{
 white-space:nowrap;

 display:flex;
 gap:14px;
 color:var(--muted);
 font-size:11.5px;
 letter-spacing:0.7px;
 flex-wrap:wrap;
 justify-content:flex-end;
 }
 nav a{ white-space:nowrap; }
 nav a[aria-current="page"]{
 color:var(--text);
 text-decoration:none;
 border-bottom:1px solid var(--text);
 padding-bottom:2px;
 }


 /* HERO */
 .hero{
 margin-top:18px;
 border:1px solid var(--line);
 border-radius:18px;
 overflow:hidden;
 background:#0b1220;
 position:relative;
 }
 .heroMedia{
 aspect-ratio: 16 / 9;
 width:100%;
 position:relative;
 background:#0b1220;
 }
 .heroMedia > img{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 object-fit:cover;
 display:block;
 }
 .heroMedia:after{
 content:"";
 position:absolute;
 inset:0;
 background:
 linear-gradient(to top, rgba(0,0,0,0.6), rgba(0,0,0,0.25));
 pointer-events:none;
 }
 .heroInner{
 position:absolute;
 inset:auto 0 0 0;
 padding:22px 20px 18px;
 color:#fff;
 z-index:2;
 }
 .kicker{
 font-size:11px;
 text-transform:uppercase;
 letter-spacing:1px;
 opacity:.9;
 margin:0 0 6px;
 }
 h1{
 margin:0 0 10px;
 font-size:clamp(28px,4vw,46px);
 line-height:1.08;
 font-weight:800;
 }
 .lead{
 margin:0 0 18px;
 max-width:760px;
 color:rgba(255,255,255,0.88);
 font-size:14.5px;
 }

 .ctaRow{
 display:flex;
 gap:14px;
 flex-wrap:wrap;
 align-items:center;
 }
.ctaRow .btn{ min-width:160px; }


 .btn{
 display:inline-flex;
 align-items:center;
 justify-content:center;
 min-height:44px;
 padding:0 16px;
 border:1px solid rgba(255,255,255,0.9);
 border-radius:10px;
 font-weight:700;
 font-size:13px;
 color:#fff;
 backdrop-filter: blur(6px);
 background: rgba(255,255,255,0.08);
 }

 .btn.primary{
 background:#fff;
 color:#111;
 border-color:#fff;
 }

 .btn.logo{
 background:#fff;
 color:#111;
 border-color:#fff;
 padding:0 16px;
 }


 .btn.logo img{
 height:40px;
 width:auto;
 display:block;
 image-rendering: -webkit-optimize-contrast;
}


 footer{
 margin-top:72px;
 padding-top:22px;
 border-top:1px solid var(--line);
 color:var(--muted);
 font-size:12px;
 display:flex;
 justify-content:space-between;
 gap:12px 18px;
 flex-wrap:wrap;
 }
 </style>
</head>
<body>
<div class="wrap">
<header>
<div class="topbar">
<div class="brand"><a href="./index.html">AKFF</a></div>
<nav aria-label="Primary">
<a aria-current="page" href="./index.html">Home</a>
<a href="./about.html">About</a>
<a href="./awards.html">Awards</a>
<a href="./submit.html">Submission</a>
<a href="./contact.html">Contact</a>


</nav>
</div>
</header>
<main>
<section aria-label="Hero" class="hero">
<div class="heroMedia">
<img alt="AKFF key visual" src="./hero-akff.png"/>
<div class="heroInner">
<p class="kicker">Ara Korea Film Festival</p>
<h1>AKFF</h1>
<p class="lead">
 Recognizing overall excellence across all genres and formats.
 </p>
<div class="ctaRow">
<a class="btn primary" href="./submit.html">Call for Entries</a>
<a aria-label="Submit via FilmFreeway" class="btn logo" href="https://filmfreeway.com/arakorea" rel="noopener" target="_blank">
<img alt="FilmFreeway" src="./filmfreeway-logo-hi.png"/>
</a>
</div>
</div>
</div>
</section>
<footer>
<div>© <span id="y"></span> Ara Korea Film Festival</div>
<div>Organized and operated by <a href="https://arakorea.org" rel="noopener" target="_blank">ARA KOREA</a></div>
</footer>
</main>
</div>
<script>
 document.getElementById('y').textContent = new Date().getFullYear();
 </script>
</body>
</html>
